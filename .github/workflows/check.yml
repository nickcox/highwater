name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

  rust-other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --all-targets --locked

  contract-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/check.sh --full --skip-rust-checks

  bb-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            integrations/bb/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/cache@v5
        with:
          path: ~/.bb/plugins/toolchain-*
          key: ${{ runner.os }}-bb-toolchain-0.49.0
      - run: scripts/check-bb-plugin.sh

  # A plugin release tag must pin the Highwater release of the same version and differ from
  # that release's tag only in the pin, so the plugin's UI and binary come from the same source.
  bb-plugin-release:
    if: startsWith(github.ref, 'refs/tags/bb-plugin-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python integrations/bb/scripts/check-bb-release.py --plugin-tag "$GITHUB_REF_NAME"

  nix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      # flake check only evaluates packages, so build the package (and run its tests) as well.
      - run: nix build -L
