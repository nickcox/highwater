# How a harness provider bills over time. Maintained by hand; every entry cites a source.
#
# A call matches the first entry whose provider (and harness, when given) match and whose
# period covers the call's time. Calls that match no entry are billed per token.
#
#   provider        provider ID as the harness records it
#   harness         "pi", "opencode" or "claude-code"; omitted means any harness
#   price_provider  models.dev provider to price the call with, when the harness's
#                   provider ID is not a models.dev provider
#   billing         "perToken" or "subscription"
#   valid_from      inclusive; omitted means from the start
#   valid_until     exclusive; omitted means with no end
#
# OpenCode's ChatGPT-plan login is recorded under the plain `openai` provider, so it
# cannot be listed here. Highwater treats an OpenCode `openai` call recorded at $0, where
# models.dev lists a price for that model at that time, as a subscription instead.

[[mode]]
harness = "pi"
provider = "openai-codex"
price_provider = "openai"
billing = "subscription"
source = "Pi's `openai-codex` provider signs in with a ChatGPT plan (@earendil-works/pi-ai, dist/models.generated.js)"

[[mode]]
provider = "github-copilot"
billing = "subscription"
valid_until = "2026-06-01T00:00:00Z"
source = "https://the-decoder.com/github-copilot-switches-to-token-based-billing-in-june-2026/"

[[mode]]
provider = "github-copilot"
billing = "perToken"
valid_from = "2026-06-01T00:00:00Z"
source = "https://the-decoder.com/github-copilot-switches-to-token-based-billing-in-june-2026/"

# Claude Code transcripts do not record whether a session used a Claude subscription or an
# API key. Subscription pricing shows API-equivalent cost, which is true either way, because
# Anthropic's API rate is also the price an API key pays.
[[mode]]
harness = "claude-code"
provider = "anthropic"
billing = "subscription"
source = "Claude Code transcripts do not record the billing mode; see docs/sources/claude-code.md"
