[package]
name = "highwater"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "A local viewer for how coding-agent sessions use their context window, call by call"
license = "MIT"
repository = "https://github.com/nickcox/highwater"
readme = "README.md"
keywords = ["llm", "tokens", "context", "visualization", "coding-agent"]
categories = ["command-line-utilities", "visualization", "development-tools"]

[profile.dev.package.tiktoken]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[dependencies]
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3"
notify = "8"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
rusqlite = { version = "0.38", features = ["bundled", "limits", "hooks"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust-embed = "8"
mime_guess = "2"
blake3 = "1"
percent-encoding = "2"
tiktoken = { version = "=4.1.2", default-features = false, features = ["vocab-openai"] }
regex = "1"
rustc-hash = "2"
unicode-normalization = "0.1"
unicode-general-category = "1.1.0"
ruzstd = "0.9.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
