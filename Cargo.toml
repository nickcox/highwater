[package]
name = "tokenplume"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[profile.dev.package.tiktoken]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[dependencies]
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3"
notify = "8"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust-embed = "8"
mime_guess = "2"
blake3 = "1"
tiktoken = { version = "=4.1.2", default-features = false, features = ["vocab-openai"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
